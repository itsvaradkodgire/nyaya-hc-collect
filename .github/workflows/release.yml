name: release-artifacts
on:
  workflow_dispatch:
    inputs:
      names:
        description: "space-separated artifact names to publish as release assets"
        required: true
      tag:
        description: "release tag"
        default: "data-drop"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: fetch and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" \
              --title "${{ inputs.tag }}" --notes "artifact mirror for fast CDN download"
          EXISTING=$(gh release view "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          FAILED=0
          for NAME in ${{ inputs.names }}; do
            if echo "$EXISTING" | grep -qx "$NAME.tar.gz"; then
              echo "skip $NAME (already uploaded)"; continue
            fi
            (
              set -e
              ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&name=$NAME" \
                --jq '.artifacts[] | select(.expired==false) | .id' | head -1)
              [ -n "$ID" ] || { echo "skip $NAME (not found)"; exit 0; }
              echo "fetch $NAME ($ID)"
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > a.zip
              unzip -qo a.zip
              FILE=$(ls *.tar.gz | grep -v "^$NAME.tar.gz$" | head -1 || true)
              [ -n "$FILE" ] && mv "$FILE" "$NAME.tar.gz"
              gh release upload "${{ inputs.tag }}" "$NAME.tar.gz" -R "$GITHUB_REPOSITORY" --clobber
            ) || { echo "FAILED $NAME"; FAILED=$((FAILED+1)); }
            rm -f a.zip *.tar.gz
          done
          echo "done, $FAILED failures"
          [ "$FAILED" = "0" ]
