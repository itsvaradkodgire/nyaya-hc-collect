name: release-artifacts
on:
  workflow_dispatch:
    inputs:
      names:
        description: "space-separated artifact names to publish as release assets"
        required: true
      tag:
        description: "release tag"
        default: "data-drop"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: fetch and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" \
              --title "${{ inputs.tag }}" --notes "artifact mirror for fast CDN download"
          for NAME in ${{ inputs.names }}; do
            ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&name=$NAME" \
              --jq '.artifacts[] | select(.expired==false) | .id' | head -1)
            [ -n "$ID" ] || { echo "skip $NAME (not found)"; continue; }
            echo "fetch $NAME ($ID)"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > a.zip
            unzip -qo a.zip   # contains <something>.tar.gz
            FILE=$(ls *.tar.gz | head -1)
            [ "$FILE" != "$NAME.tar.gz" ] && mv "$FILE" "$NAME.tar.gz"
            gh release upload "${{ inputs.tag }}" "$NAME.tar.gz" -R "$GITHUB_REPOSITORY" --clobber
            rm -f a.zip "$NAME.tar.gz"
          done
          echo "ALL UPLOADED"
